<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cozinha</title>
<!-- Versão iPad: iOS 9.3.5. Arquivo único, sem login ou bibliotecas. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%}
body{font-family:-apple-system,Helvetica,Arial,sans-serif;color:#2e3440;background:#f6efe9;background:radial-gradient(ellipse at 5% 5%,#ffd9c7,transparent 65%),radial-gradient(ellipse at 95% 10%,#cfe3fb,transparent 65%),radial-gradient(ellipse at 90% 95%,#cdeedd,transparent 65%),#eee5f4;-webkit-user-select:none;user-select:none}
/* iOS 9: no Grid, CSS variables, flex gap or mandatory backdrop blur. */
.grid{position:relative;width:100%;height:100%;min-height:650px}
.card{position:absolute;overflow:hidden;padding:22px 26px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:30px;box-shadow:0 8px 24px rgba(90,80,110,.10);display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
#clock,#timer,#music{left:2%;width:44%}
#recipe{left:48%;width:50%}
#clock{top:2.4%;height:22%}
#timer{top:26.8%;height:42.4%}
#music{top:71.6%;height:26%}
#recipe{top:2.4%;height:95.2%}
.label{font-size:18px;font-weight:600;color:#5b6472;margin-bottom:8px}
#clock{-webkit-justify-content:center;justify-content:center}
#time{font-size:90px;font-size:13vmin;font-weight:700;letter-spacing:-.04em;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
#time span{opacity:.5}#date{font-size:22px;line-height:1.25;font-weight:500;margin-top:10px;color:#5b6472}
#tdisp{font-size:88px;font-size:12vmin;font-weight:700;line-height:1.1;text-align:center;margin:2px 0 14px;font-variant-numeric:tabular-nums}
.row{display:-webkit-flex;display:flex;width:100%;-webkit-flex-shrink:0;flex-shrink:0}.row .btn+.btn{margin-left:10px}
.btn{-webkit-appearance:none;appearance:none;-webkit-flex:1;flex:1;min-width:0;min-height:54px;border:0;border-radius:20px;padding:16px 8px;font:inherit;font-size:27px;line-height:1.15;font-weight:700;color:#2e3440;background:rgba(255,255,255,.85);box-shadow:0 3px 10px rgba(90,80,110,.09);cursor:pointer}
.btn:active{background:#e9e2dc}.btn.main{background:#d96f4a;color:#fff}.btn.sec{font-size:22px;font-weight:600;background:rgba(255,255,255,.6)}.btn:disabled{opacity:.4;cursor:default}
#timer .row+.row{margin-top:12px}#timer.ring{background:#ffdfbd}#stop{display:none;background:#bd3632;color:white;font-size:29px}#timer.ring #stop{display:block}#timer.ring .row{display:none}#timer.ring #stoprow{display:-webkit-flex;display:flex}#stoprow{display:none}
/* Música */
#music{-webkit-justify-content:center;justify-content:center}
#station{font-size:24px;font-weight:700;margin-bottom:2px}
#mstat{font-size:17px;color:#5b6472;margin-bottom:12px}
#music .btn{font-size:26px}
/* Receita */
#rsel{-webkit-appearance:none;appearance:none;width:100%;font:inherit;font-size:23px;font-weight:600;color:#2e3440;background:rgba(255,255,255,.85);border:0;border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:0 3px 10px rgba(90,80,110,.09)}
#tabs{margin-bottom:12px}
#tabs .btn{font-size:22px;padding:12px 8px;min-height:48px}
#tabs .btn.on{background:#6fae94;color:#fff}
#rbody{-webkit-flex:1;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#rbody ul{list-style:none}
#rbody li{font-size:24px;font-weight:600;line-height:1.3;padding:10px 2px;border-bottom:1px solid rgba(90,80,110,.12)}
#rbody li:last-child{border-bottom:0}
#rnote{font-size:16px;color:#5b6472;margin-top:10px}
#dots{display:-webkit-flex;display:flex;margin:4px 0 12px;-webkit-flex-shrink:0;flex-shrink:0}#dots i{-webkit-flex:1;flex:1;height:7px;border-radius:5px;background:rgba(255,255,255,.8)}#dots i+i{margin-left:6px}#dots i.on{background:#6fae94}
#stepn{font-size:18px;font-weight:600;color:#477b66;margin-bottom:7px}#steptxt{font-size:28px;font-weight:600;line-height:1.25}#stepbtn{margin-top:10px;padding:12px 15px;font-size:20px;background:#cdeedd;min-height:48px}
#stepnav{margin-top:14px}#stepnav .btn{font-size:24px;padding:14px 8px}
@media(max-height:700px) and (min-aspect-ratio:1/1){.grid{min-height:600px}.card{padding:16px 22px}.label{margin-bottom:6px}#time{font-size:80px}#date{font-size:20px;margin-top:6px}#tdisp{margin-bottom:10px}#rsel{margin-bottom:8px}#steptxt{font-size:25px}#rbody li{font-size:21px;padding:8px 2px}#station{font-size:21px}#mstat{margin-bottom:8px}}
@media(max-aspect-ratio:1/1){body{overflow-y:auto}.grid{height:auto;min-height:100%}.card{position:relative!important;top:auto!important;left:auto!important;width:94%!important;height:auto!important;margin:3% auto;padding:22px}#clock{min-height:170px}#timer{min-height:330px}#music{min-height:180px}#recipe{min-height:480px}#time{font-size:19vmin}#tdisp{font-size:90px}#rbody{min-height:200px}#date{font-size:21px}}
</style>
</head>
<body>
<div class="grid">

  <section class="card" id="clock">
    <div id="time">--<span>:</span>--</div>
    <div id="date"></div>
  </section>

  <section class="card" id="timer">
    <div class="label">Cronômetro</div>
    <div id="tdisp">00:00</div>
    <div class="row">
      <button class="btn" data-min="5">5 min</button>
      <button class="btn" data-min="10">10 min</button>
      <button class="btn" data-min="30">30 min</button>
    </div>
    <div class="row">
      <button class="btn sec" id="plus">+1 min</button>
      <button class="btn sec" id="pause">Pausar</button>
      <button class="btn sec" id="reset">Zerar</button>
    </div>
    <div class="row" id="stoprow"><button class="btn" id="stop">Parar alarme</button></div>
  </section>

  <section class="card" id="music">
    <div class="label">Música</div>
    <div id="station">Antena 1</div>
    <div id="mstat">Toque em Tocar para ouvir ao vivo</div>
    <div class="row">
      <button class="btn main" id="mplay">Tocar</button>
      <button class="btn sec" id="mstop">Parar</button>
    </div>
    <audio id="radio" preload="none" src="https://antenaone.crossradio.com.br/stream/1"></audio>
  </section>

  <section class="card" id="recipe">
    <div class="label">Receitas</div>
    <select id="rsel"></select>
    <div class="row" id="tabs">
      <button class="btn on" id="tabing">Ingredientes</button>
      <button class="btn" id="tabprep">Preparo</button>
    </div>
    <div id="dots" style="display:none"></div>
    <div id="rbody"></div>
    <div class="row" id="stepnav" style="display:none">
      <button class="btn" id="prev">Anterior</button>
      <button class="btn main" id="next">Próximo</button>
    </div>
  </section>

</div>

<script>
/* ============================================================
   RECEITAS: para adicionar uma nova, copie um bloco { ... },
   preencha titulo, ingredientes e passos. "min" no passo cria
   um botão que inicia o cronômetro com aqueles minutos.
   ============================================================ */
var RECEITAS = [
  {
    titulo: "Pão de queijo mineiro",
    ingredientes: [
      "3 xícaras de polvilho azedo",
      "1 xícara de leite",
      "1/2 xícara de óleo",
      "1 colher de chá de sal",
      "2 ovos",
      "200 g de queijo meia cura ralado"
    ],
    passos: [
      { t: "Aqueça o forno a 200 °C e unte uma assadeira." },
      { t: "Ferva o leite, o óleo e o sal." },
      { t: "Despeje a mistura quente sobre o polvilho e misture bem." },
      { t: "Deixe a massa amornar por uns minutos.", min: 10 },
      { t: "Junte os ovos, um a um, e o queijo ralado. Amasse até ficar lisa." },
      { t: "Faça bolinhas com as mãos untadas e distribua na assadeira." },
      { t: "Asse até dourar.", min: 30 },
      { t: "Pronto! Sirva quentinho." }
    ]
  }
];

function $(id){return document.getElementById(id)}
function pad(n){return (n<10?'0':'')+n}

/* ===== Relógio e data ===== */
var blink = true;
function tickClock(){
  var d = new Date(); blink = !blink;
  $('time').innerHTML = pad(d.getHours()) + '<span style="opacity:' + (blink?.9:.25) + '">:</span>' + pad(d.getMinutes());
  var semana = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  var meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var s = semana[d.getDay()] + ', ' + d.getDate() + ' de ' + meses[d.getMonth()] + ' de ' + d.getFullYear();
  $('date').textContent = s.charAt(0).toUpperCase() + s.slice(1);
}
tickClock(); setInterval(tickClock, 1000);

/* ===== Cronômetro e alarme ===== */
var endAt = 0, left = 0, running = false, ringTimer = null, ctx = null;
function audio(){
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!ctx && AC) ctx = new AC();
    if(ctx && ctx.state === 'suspended' && typeof ctx.resume === 'function') ctx.resume();
    // Safari antigo exige desbloquear o áudio durante um toque.
    if(ctx && !ctx._cozinhaUnlocked){
      var source = ctx.createBufferSource();
      source.buffer = ctx.createBuffer(1, 1, 22050);
      source.connect(ctx.destination);
      source.start(0);
      ctx._cozinhaUnlocked = true;
    }
  }catch(e){}
}
function beep(){
  if(!ctx) return;
  [0,.22,.44].forEach(function(dt){
    var o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + dt;
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.6,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.18);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+.2);
  });
}
function show(ms){
  var s = Math.max(0, Math.ceil(ms/1000));
  $('tdisp').textContent = pad(Math.floor(s/60)) + ':' + pad(s%60);
}
function start(min){
  audio(); stopAlarm();
  left = min*60000; endAt = Date.now() + left; running = true;
  $('pause').textContent = 'Pausar'; show(left);
}
function ring(){
  running = false; left = 0; show(0);
  $('timer').className = 'card ring';
  beep(); ringTimer = setInterval(beep, 1400);
  if(navigator.vibrate) navigator.vibrate([400,200,400]);
}
function stopAlarm(){
  if(ringTimer){ clearInterval(ringTimer); ringTimer = null; }
  $('timer').className = 'card';
}
setInterval(function(){
  if(running){
    left = endAt - Date.now();
    if(left <= 0) ring(); else show(left);
  }
}, 200);

var mb = document.querySelectorAll('[data-min]');
for(var i=0;i<mb.length;i++){ (function(b){ b.onclick = function(){ start(+b.getAttribute('data-min')); }; })(mb[i]); }
$('plus').onclick = function(){
  audio(); stopAlarm();
  if(running){ endAt += 60000; left = endAt - Date.now(); }
  else { left += 60000; $('pause').textContent = 'Iniciar'; }
  show(left);
};
$('pause').onclick = function(){
  audio();
  if(running){ running = false; left = endAt - Date.now(); this.textContent = 'Continuar'; }
  else if(left > 0){ endAt = Date.now() + left; running = true; this.textContent = 'Pausar'; }
};
$('reset').onclick = function(){ running = false; left = 0; show(0); $('pause').textContent = 'Pausar'; stopAlarm(); };
$('stop').onclick = function(){ stopAlarm(); show(0); };

/* ===== Música: Antena 1 ao vivo ===== */
var radio = $('radio');
$('mplay').onclick = function(){
  audio();
  $('mstat').textContent = 'Conectando…';
  radio.play();
};
$('mstop').onclick = function(){
  radio.pause();
  // Recarrega o stream na próxima vez, sem guardar trecho antigo.
  try{ radio.load(); }catch(e){}
  $('mstat').textContent = 'Toque em Tocar para ouvir ao vivo';
};
radio.onplaying = function(){ $('mstat').textContent = 'Tocando ao vivo'; };
radio.onerror = function(){ $('mstat').textContent = 'Não consegui tocar. Verifique a internet.'; };
radio.onstalled = function(){ $('mstat').textContent = 'Sinal lento, aguarde…'; };

/* ===== Receitas: escolha, ingredientes e preparo ===== */
var ridx = 0, idx = 0, stage = 'ing';
var sel = $('rsel');
for(var r=0;r<RECEITAS.length;r++){
  var op = document.createElement('option');
  op.value = r; op.textContent = RECEITAS[r].titulo;
  sel.appendChild(op);
}
function cur(){ return RECEITAS[ridx]; }
function renderDots(){
  var P = cur().passos, dh = '';
  for(var k=0;k<P.length;k++) dh += '<i class="' + (k<=idx ? 'on' : '') + '"></i>';
  $('dots').innerHTML = dh;
}
function renderIngr(){
  var h = '<h2 style="font-size:26px;font-weight:700;margin-bottom:8px">' + cur().titulo + '</h2><ul>';
  for(var k=0;k<cur().ingredientes.length;k++) h += '<li>' + cur().ingredientes[k] + '</li>';
  h += '</ul><div id="rnote">Confira os ingredientes e toque em Preparo para começar o passo a passo.</div>';
  $('rbody').innerHTML = h;
}
function renderStep(){
  var P = cur().passos, p = P[idx];
  renderDots();
  var h = '<div id="stepn">Passo ' + (idx+1) + ' de ' + P.length + '</div>' +
          '<div id="steptxt">' + p.t + '</div>';
  if(p.min) h += '<button class="btn" id="stepbtn">Iniciar cronômetro de ' + p.min + ' min</button>';
  $('rbody').innerHTML = h;
  if(p.min) $('stepbtn').onclick = function(){ start(p.min); };
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === P.length-1;
}
function render(){
  if(stage === 'ing'){
    $('tabing').className = 'btn on'; $('tabprep').className = 'btn';
    $('dots').style.display = 'none'; $('stepnav').style.display = 'none';
    renderIngr();
  }else{
    $('tabing').className = 'btn'; $('tabprep').className = 'btn on';
    $('dots').style.display = '-webkit-flex'; $('dots').style.display = 'flex';
    $('stepnav').style.display = '-webkit-flex'; $('stepnav').style.display = 'flex';
    renderStep();
  }
}
sel.onchange = function(){ ridx = +sel.value; idx = 0; stage = 'ing'; render(); };
$('tabing').onclick = function(){ stage = 'ing'; render(); };
$('tabprep').onclick = function(){ stage = 'prep'; render(); };
$('prev').onclick = function(){ if(idx>0){ idx--; renderStep(); } };
$('next').onclick = function(){ if(idx<cur().passos.length-1){ idx++; renderStep(); } };
render();

/* ===== Tela acesa: apenas navegadores compatíveis =====
   No iOS 9, use Bloqueio Automático > Nunca nos Ajustes do iPad.
   Alarme requer página aberta e tela desbloqueada. */
function keepAwake(){
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen'); }catch(e){}
}
keepAwake();
document.addEventListener('visibilitychange', function(){ if(!document.hidden) keepAwake(); });
document.addEventListener('touchstart', audio, false);
</script>
</body>
</html>
