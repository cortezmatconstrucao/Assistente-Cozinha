<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cozinha</title>
<!-- Versão iPad: iOS 9.3.5. Arquivo único, sem login ou bibliotecas. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%}
body{font-family:-apple-system,Helvetica,Arial,sans-serif;color:#2e3440;background:#f6efe9;background:radial-gradient(ellipse at 5% 5%,#ffd9c7,transparent 65%),radial-gradient(ellipse at 95% 10%,#cfe3fb,transparent 65%),radial-gradient(ellipse at 90% 95%,#cdeedd,transparent 65%),#eee5f4;-webkit-user-select:none;user-select:none}
/* iOS 9: no Grid, CSS variables, flex gap or mandatory backdrop blur. */
.grid{position:relative;width:100%;height:100%;min-height:650px}
.card{position:absolute;overflow:hidden;padding:24px 28px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:30px;box-shadow:0 8px 24px rgba(90,80,110,.10);display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
#clock,#timer{left:2%;width:48%}#weather,#recipe{left:52%;width:46%}
#clock,#weather{top:2.4%;height:41%}#timer,#recipe{top:45.8%;height:51.8%}
.label{font-size:18px;font-weight:600;color:#5b6472;margin-bottom:10px}
#weather{display:block}#clock{-webkit-justify-content:center;justify-content:center}
#time{font-size:140px;font-size:18vmin;font-weight:700;letter-spacing:-.04em;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
#time span{opacity:.5}#date{font-size:26px;line-height:1.3;font-weight:500;margin-top:16px;color:#5b6472}
#now{display:table;width:100%;margin:0 0 8px}#now>div{display:table-cell;vertical-align:middle}#now .ico{font-size:58px;width:72px;line-height:1.2}#now .temp{font-size:68px;font-weight:700;line-height:1.1;white-space:nowrap}#now .desc{font-size:23px;font-weight:600;line-height:1.1}#now .det{font-size:16px;color:#5b6472;margin-top:5px;line-height:1.25}
#wmsg{font-size:17px;color:#5b6472;line-height:1.35;margin-bottom:8px}
#days{position:absolute;left:28px;right:28px;bottom:24px;display:-webkit-flex;display:flex;-webkit-flex-shrink:0;flex-shrink:0}#days .day+.day{margin-left:8px}
.day{-webkit-flex:1;flex:1;background:rgba(255,255,255,.6);border-radius:15px;padding:8px 2px;text-align:center}.day b{display:block;font-size:18px;line-height:21px;font-weight:600}.day i{display:block;font-style:normal;font-size:27px;line-height:30px;margin:2px 0}.day span{font-size:21px;line-height:24px;font-weight:600}.day small{display:block;font-size:14px;line-height:16px;color:#5b6472;margin-top:2px}
#tdisp{font-size:100px;font-size:13vmin;font-weight:700;line-height:1.1;text-align:center;margin:6px 0 20px;font-variant-numeric:tabular-nums}
.row{display:-webkit-flex;display:flex;width:100%;-webkit-flex-shrink:0;flex-shrink:0}.row .btn+.btn{margin-left:10px}
.btn{-webkit-appearance:none;appearance:none;-webkit-flex:1;flex:1;min-width:0;min-height:54px;border:0;border-radius:20px;padding:16px 8px;font:inherit;font-size:27px;line-height:1.15;font-weight:700;color:#2e3440;background:rgba(255,255,255,.85);box-shadow:0 3px 10px rgba(90,80,110,.09);cursor:pointer}
.btn:active{background:#e9e2dc}.btn.main{background:#d96f4a;color:#fff}.btn.sec{font-size:22px;font-weight:600;background:rgba(255,255,255,.6)}.btn:disabled{opacity:.4;cursor:default}
#timer .row+.row{margin-top:12px}#timer.ring{background:#ffdfbd}#stop{display:none;background:#bd3632;color:white;font-size:29px}#timer.ring #stop{display:block}#timer.ring .row{display:none}#timer.ring #stoprow{display:-webkit-flex;display:flex}#stoprow{display:none}
#recipe h2{font-size:25px;font-weight:700;margin-bottom:3px}#dots{display:-webkit-flex;display:flex;margin:8px 0 12px;-webkit-flex-shrink:0;flex-shrink:0}#dots i{-webkit-flex:1;flex:1;height:7px;border-radius:5px;background:rgba(255,255,255,.8)}#dots i+i{margin-left:6px}#dots i.on{background:#6fae94}
#step{-webkit-flex:1;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}#stepn{font-size:18px;font-weight:600;color:#477b66;margin-bottom:7px}#steptxt{font-size:28px;font-weight:600;line-height:1.25}#stepbtn{margin-top:10px;padding:12px 15px;font-size:20px;background:#cdeedd;min-height:48px}#recipe>.row{margin-top:14px}#recipe>.row .btn{font-size:24px;padding:14px 8px}
@media(max-height:700px) and (min-aspect-ratio:1/1){.grid{min-height:600px}.card{padding:18px 24px}#weather{padding-top:10px;padding-bottom:10px}#weather .label{margin-bottom:5px}#days{left:24px;right:24px;bottom:10px}#now .ico{font-size:48px;width:62px}#date{font-size:23px}#tdisp{margin-bottom:12px}#steptxt{font-size:25px}#recipe h2{font-size:23px}.label{margin-bottom:7px}#now .temp{font-size:60px}.day{padding:5px 2px}}
@media(max-aspect-ratio:1/1){body{overflow-y:auto}.grid{height:auto;min-height:100%}.card{position:relative!important;top:auto!important;left:auto!important;width:94%!important;height:auto!important;margin:3% auto;padding:24px}#clock{min-height:200px}#weather{min-height:300px}#timer{min-height:330px}#recipe{min-height:390px}#time{font-size:19vmin}#tdisp{font-size:100px}#step{min-height:170px}#date{font-size:23px}}
</style>
</head>
<body>
<div class="grid">

  <section class="card" id="clock">
    <div id="time">--<span>:</span>--</div>
    <div id="date"></div>
  </section>

  <section class="card" id="weather">
    <div class="label">Braúna – SP</div>
    <div id="now"><div class="ico" id="wico">…</div>
      <div><div class="temp" id="wtemp">--°</div></div>
      <div><div class="desc" id="wdesc">Carregando</div><div class="det" id="wdet"></div></div>
    </div>
    <div id="wmsg"></div>
    <div id="days"></div>
  </section>

  <section class="card" id="timer">
    <div class="label">Cronômetro</div>
    <div id="tdisp">00:00</div>
    <div class="row">
      <button class="btn" data-min="5">5 min</button>
      <button class="btn" data-min="10">10 min</button>
      <button class="btn" data-min="30">30 min</button>
    </div>
    <div class="row">
      <button class="btn sec" id="plus">+1 min</button>
      <button class="btn sec" id="pause">Pausar</button>
      <button class="btn sec" id="reset">Zerar</button>
    </div>
    <div class="row" id="stoprow"><button class="btn" id="stop">Parar alarme</button></div>
  </section>

  <section class="card" id="recipe">
    <div class="label">Receita</div>
    <h2 id="rtitle"></h2>
    <div id="dots"></div>
    <div id="step">
      <div id="stepn"></div>
      <div id="steptxt"></div>
      <button class="btn" id="stepbtn"></button>
    </div>
    <div class="row">
      <button class="btn" id="prev">Anterior</button>
      <button class="btn main" id="next">Próximo</button>
    </div>
  </section>

</div>

<script>
/* ===== Troque aqui a receita ===== */
var RECEITA = {
  titulo: "Pão de queijo mineiro",
  passos: [
    { t: "Aqueça o forno a 200 °C e unte uma assadeira." },
    { t: "Ferva 1 xícara de leite, 1/2 xícara de óleo e 1 colher de chá de sal." },
    { t: "Despeje a mistura quente sobre 3 xícaras de polvilho azedo e misture bem." },
    { t: "Deixe a massa amornar por uns minutos.", min: 10 },
    { t: "Junte 2 ovos, um a um, e 200 g de queijo meia cura ralado. Amasse até ficar lisa." },
    { t: "Faça bolinhas com as mãos untadas e distribua na assadeira." },
    { t: "Asse até dourar.", min: 30 },
    { t: "Pronto! Sirva quentinho." }
  ]
};
var LAT = -21.50, LON = -50.32; // Braúna - SP

function $(id){return document.getElementById(id)}
function pad(n){return (n<10?'0':'')+n}

/* ===== Relógio e data ===== */
var blink = true;
function tickClock(){
  var d = new Date(); blink = !blink;
  $('time').innerHTML = pad(d.getHours()) + '<span style="opacity:' + (blink?.9:.25) + '">:</span>' + pad(d.getMinutes());
  var semana = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  var meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var s = semana[d.getDay()] + ', ' + d.getDate() + ' de ' + meses[d.getMonth()] + ' de ' + d.getFullYear();
  $('date').textContent = s.charAt(0).toUpperCase() + s.slice(1);
}
tickClock(); setInterval(tickClock, 1000);

/* ===== Previsão (Open-Meteo) ===== */
var WMO = {
  0:['☀️','Céu limpo'],1:['🌤️','Poucas nuvens'],2:['⛅','Parcialmente nublado'],3:['☁️','Nublado'],
  45:['🌫️','Neblina'],48:['🌫️','Neblina'],51:['🌦️','Garoa fraca'],53:['🌦️','Garoa'],55:['🌦️','Garoa forte'],
  61:['🌧️','Chuva fraca'],63:['🌧️','Chuva'],65:['🌧️','Chuva forte'],80:['🌦️','Pancadas de chuva'],
  81:['🌧️','Pancadas fortes'],82:['⛈️','Temporal'],95:['⛈️','Trovoada'],96:['⛈️','Trovoada com granizo'],99:['⛈️','Trovoada com granizo']
};
function wmo(c){return WMO[c] || ['🌡️','—']}
function loadWeather(){
  var url = 'https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+
    '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m'+
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'+
    '&timezone=America%2FSao_Paulo&forecast_days=4';
  var x = new XMLHttpRequest();
  x.open('GET', url); x.timeout = 15000;
  x.onload = function(){
    try{
      if(x.status < 200 || x.status >= 300) throw new Error('weather');
      var j = JSON.parse(x.responseText), c = j.current, dl = j.daily, w = wmo(c.weather_code);
      $('wico').textContent = w[0];
      $('wtemp').textContent = Math.round(c.temperature_2m) + '°';
      $('wdesc').textContent = w[1];
      $('wdet').textContent = 'Sensação ' + Math.round(c.apparent_temperature) + '° · Umidade ' + c.relative_humidity_2m + '%';
      $('wmsg').textContent = 'Hoje: máx ' + Math.round(dl.temperature_2m_max[0]) + '° · mín ' + Math.round(dl.temperature_2m_min[0]) +
        '° · chuva ' + dl.precipitation_probability_max[0] + '%';
      var h = '';
      for(var i=1;i<4;i++){
        var dt = new Date(dl.time[i] + 'T12:00:00');
        var nome = ['dom','seg','ter','qua','qui','sex','sáb'][dt.getDay()];
        h += '<div class="day"><b>'+nome+'</b><i>'+wmo(dl.weather_code[i])[0]+'</i><span>'+
          Math.round(dl.temperature_2m_max[i])+'°</span><small>'+Math.round(dl.temperature_2m_min[i])+'° · '+
          dl.precipitation_probability_max[i]+'%</small></div>';
      }
      $('days').innerHTML = h;
    }catch(e){ fail(); }
  };
  x.onerror = x.ontimeout = fail;
  x.send();
}
function fail(){ $('wdesc').textContent = 'Sem atualização'; $('wmsg').textContent = 'Previsão indisponível. Nova tentativa em 1 min.'; setTimeout(loadWeather, 60000); }
loadWeather(); setInterval(loadWeather, 15*60*1000);

/* ===== Cronômetro e alarme ===== */
var endAt = 0, left = 0, running = false, ringTimer = null, ctx = null;
function audio(){
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!ctx && AC) ctx = new AC();
    if(ctx && ctx.state === 'suspended' && typeof ctx.resume === 'function') ctx.resume();
    // Safari antigo exige desbloquear o áudio durante um toque.
    if(ctx && !ctx._cozinhaUnlocked){
      var source = ctx.createBufferSource();
      source.buffer = ctx.createBuffer(1, 1, 22050);
      source.connect(ctx.destination);
      source.start(0);
      ctx._cozinhaUnlocked = true;
    }
  }catch(e){}
}
function beep(){
  if(!ctx) return;
  [0,.22,.44].forEach(function(dt){
    var o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + dt;
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.6,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.18);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+.2);
  });
}
function show(ms){
  var s = Math.max(0, Math.ceil(ms/1000));
  $('tdisp').textContent = pad(Math.floor(s/60)) + ':' + pad(s%60);
}
function start(min){
  audio(); stopAlarm();
  left = min*60000; endAt = Date.now() + left; running = true;
  $('pause').textContent = 'Pausar'; show(left);
}
function ring(){
  running = false; left = 0; show(0);
  $('timer').className = 'card ring';
  beep(); ringTimer = setInterval(beep, 1400);
  if(navigator.vibrate) navigator.vibrate([400,200,400]);
}
function stopAlarm(){
  if(ringTimer){ clearInterval(ringTimer); ringTimer = null; }
  $('timer').className = 'card';
}
setInterval(function(){
  if(running){
    left = endAt - Date.now();
    if(left <= 0) ring(); else show(left);
  }
}, 200);

var mb = document.querySelectorAll('[data-min]');
for(var i=0;i<mb.length;i++){ (function(b){ b.onclick = function(){ start(+b.getAttribute('data-min')); }; })(mb[i]); }
$('plus').onclick = function(){
  audio(); stopAlarm();
  if(running){ endAt += 60000; left = endAt - Date.now(); }
  else { left += 60000; $('pause').textContent = 'Iniciar'; }
  show(left);
};
$('pause').onclick = function(){
  audio();
  if(running){ running = false; left = endAt - Date.now(); this.textContent = 'Continuar'; }
  else if(left > 0){ endAt = Date.now() + left; running = true; this.textContent = 'Pausar'; }
};
$('reset').onclick = function(){ running = false; left = 0; show(0); $('pause').textContent = 'Pausar'; stopAlarm(); };
$('stop').onclick = function(){ stopAlarm(); show(0); };

/* ===== Receita ===== */
var idx = 0, P = RECEITA.passos;
$('rtitle').textContent = RECEITA.titulo;
var dh = ''; for(var k=0;k<P.length;k++) dh += '<i></i>'; $('dots').innerHTML = dh;
function renderStep(){
  var p = P[idx], d = $('dots').children;
  for(var k=0;k<d.length;k++) d[k].className = k<=idx ? 'on' : '';
  $('stepn').textContent = 'Passo ' + (idx+1) + ' de ' + P.length;
  $('steptxt').textContent = p.t;
  var b = $('stepbtn');
  if(p.min){ b.style.display = 'block'; b.textContent = 'Iniciar cronômetro de ' + p.min + ' min'; b.onclick = function(){ start(p.min); }; }
  else b.style.display = 'none';
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === P.length-1;
}
$('prev').onclick = function(){ if(idx>0){ idx--; renderStep(); } };
$('next').onclick = function(){ if(idx<P.length-1){ idx++; renderStep(); } };
renderStep();

/* ===== Tela acesa: apenas navegadores compatíveis =====
   No iOS 9, use Bloqueio Automático > Nunca nos Ajustes do iPad.
   Alarme requer página aberta e tela desbloqueada. */
function keepAwake(){
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen'); }catch(e){}
}
keepAwake();
document.addEventListener('visibilitychange', function(){ if(!document.hidden) keepAwake(); });
document.addEventListener('touchstart', audio, false);
</script>
</body>
</html>
